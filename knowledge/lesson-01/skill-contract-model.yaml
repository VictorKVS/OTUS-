id: OTUS-L01-SKILL-002
title: Выбор модели контракта
lesson: 1
status: draft
inputs:
  - полнота требований
  - уровень неопределённости
  - частота изменений
  - распределение рисков
procedure:
  - оценить полноту требований
  - определить уровень неопределённости
  - оценить частоту изменений
  - сравнить распределение рисков
  - выбрать Fixed Price, T&M или T&M with cap
  - сформировать письменное обоснование
outputs:
  - выбранная модель контракта
  - допущения
  - реестр рисков
  - аргументация решения
failure_modes:
  - выбор Fixed Price при высокой неопределённости
  - оценка без зафиксированных допущений
  - отсутствие владельца коммерческого риска
tests:
  - id: OTUS-L01-TEST-001
    scenario: три RFP с разной полнотой требований
    pass: модель обоснована, риски названы, допущения проверяемы
evidence:
  source: OTUS-L01-SRC-001
  confidence: 0.75
