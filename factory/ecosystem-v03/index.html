<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FATHER Ecosystem Workspace v0.3</title>
<style>
:root{--bg:#071017;--p:#0b161e;--p2:#0f1d27;--l:#203744;--t:#eef7fc;--m:#829aaa;--c:#4ed9ff;--g:#63e6a5;--v:#a18cff;--r:#ff7474;--b:#6daeff}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--t);font-family:Inter,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}.top{height:58px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--l)}.brand{font-weight:800;letter-spacing:.08em}.brand small{display:block;color:var(--m);font-size:9px;font-weight:500}.actions{display:flex;gap:6px}.actions button,.actions select,.canvasbar button{border:1px solid var(--l);background:#0b1720;color:var(--t);border-radius:8px;padding:7px 9px;font-size:9px}.status{height:29px;padding:0 14px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--l);font:9px Consolas;color:var(--m)}.status .ok{margin-left:auto;color:var(--g)}.shell{height:calc(100vh - 87px);padding:8px;display:grid;grid-template-columns:310px minmax(620px,1fr) 360px;grid-template-rows:minmax(0,1fr) 190px;gap:8px}.panel{border:1px solid var(--l);border-radius:12px;background:linear-gradient(145deg,#0d1922,#091219);overflow:hidden}.side{grid-row:1/3}.canvas{grid-column:2}.ins{grid-column:3}.bottom{grid-column:2/4}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:7px;border-bottom:1px solid var(--l)}.tabs button,.btabs button{border:1px solid var(--l);background:#09131a;color:var(--m);border-radius:7px;padding:6px 3px;font-size:8px}.tabs button.active,.btabs button.active{color:var(--c);border-color:var(--c)}.search{padding:7px;border-bottom:1px solid var(--l)}.search input{width:100%;padding:7px;background:#071219;color:var(--t);border:1px solid var(--l);border-radius:8px}.catalog{height:calc(100% - 80px);overflow:auto;padding:7px}.group{font-size:8px;color:var(--c);letter-spacing:.12em;margin:10px 4px 5px}.item{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--l);border-radius:9px;background:#09141b;margin:5px 0;cursor:grab}.item.core{border-left:3px solid var(--v)}.item.arch{opacity:.4}.ico{width:31px;height:31px;border:1px solid #2e4b5a;border-radius:8px;display:grid;place-items:center;background:#12232d;font:bold 8px Consolas}.item b{font-size:9px}.item small{display:block;color:var(--m);font-size:7px;margin-top:2px}.canvasbar,.inshead{height:60px;padding:9px 11px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between}.canvasbar small,.inshead small{color:var(--c);font-size:8px;letter-spacing:.12em}.canvasbar h1,.inshead h2{font-size:13px;margin:3px 0}.view{position:relative;height:calc(100% - 60px);overflow:hidden;background-color:#071017;background-image:linear-gradient(#10232d 1px,transparent 1px),linear-gradient(90deg,#10232d 1px,transparent 1px);background-size:28px 28px}.world{position:absolute;inset:0}.wires{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}.wires path{fill:none;stroke:var(--b);stroke-width:2;marker-end:url(#arr)}.node{position:absolute;width:200px;border:1px solid #2b4858;border-radius:11px;background:#0b1720;z-index:3;box-shadow:0 14px 32px #0007;user-select:none}.node.core{border-color:#6556a7}.node.int{border-color:#38645b}.nh{display:flex;gap:8px;align-items:center;padding:8px 9px;border-bottom:1px solid #19303d;cursor:move}.nh b{font-size:9px}.nh small{display:block;color:var(--m);font-size:7px}.nb{padding:8px 9px;color:var(--m);font-size:8px;line-height:1.35}.ports{padding:0 8px 8px;display:flex;justify-content:space-between}.port{width:12px;height:12px;border:2px solid #658091;border-radius:50%;background:#071017;display:inline-block;cursor:crosshair}.port.pending{border-color:var(--c);box-shadow:0 0 8px var(--c)}.insbody{height:calc(100% - 60px);overflow:auto;padding:10px;color:var(--m);font-size:9px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}.card{border:1px solid var(--l);border-radius:8px;padding:7px;background:#08131a}.card small{display:block;color:var(--m);font-size:7px}.card b{font-size:9px;color:var(--t)}.sec{margin:11px 0}.sec h3{font-size:8px;color:var(--c);letter-spacing:.1em}.folder{border:1px solid var(--l);border-radius:8px;padding:7px;margin:5px 0;background:#09141b}.folder b{font-size:8px;color:var(--t)}.folder small{display:block;font-size:7px}.btnrow{display:flex;gap:5px;flex-wrap:wrap}.btnrow button{border:1px solid var(--l);background:#0a161d;color:var(--t);padding:6px 8px;border-radius:7px;font-size:8px}.btabs{height:39px;display:flex;gap:4px;padding:7px;border-bottom:1px solid var(--l)}.bbody{height:calc(100% - 39px);overflow:auto;padding:8px;font:9px Consolas;color:#a9c1cf}.row{display:grid;grid-template-columns:140px 220px 1fr;gap:8px;padding:5px 2px;border-bottom:1px dashed #16313d}.row b{color:var(--t)}.breadcrumb{display:flex;align-items:center;gap:7px;margin-top:4px;font:8px Consolas;color:var(--m)}.breadcrumb button{border:1px solid var(--l);background:#0b1720;color:var(--c);border-radius:6px;padding:3px 6px;font-size:8px}.node.foldernode{border-color:#355264}.node.foldernode.security-folder{border-color:#72522a}.node.foldernode.evidence-folder{border-color:#2f5a47}.node.blackbox{border-color:var(--v);background:linear-gradient(145deg,#17152b,#0b1720)}dialog{border:1px solid var(--l);background:#09141b;color:var(--t);border-radius:12px;width:min(600px,90vw)}dialog::backdrop{background:#0009}dialog label{display:block;font-size:9px;color:var(--m);margin:8px 0}dialog input,dialog textarea{width:100%;margin-top:5px;padding:8px;background:#061017;color:var(--t);border:1px solid var(--l);border-radius:8px}dialog textarea{min-height:80px}@media(max-width:1200px){.shell{grid-template-columns:260px 1fr;grid-template-rows:minmax(430px,1fr) 300px 190px}.side{grid-row:1/4}.canvas{grid-column:2}.ins{grid-column:2;grid-row:2}.bottom{grid-column:2;grid-row:3}}
</style>
</head>
<body>
<header class="top"><div class="brand">FATHER ECOSYSTEM WORKSPACE<small>Agents · Components · Integrations · Knowledge · Delivery</small></div><div class="actions"><select id="layout"><option>S1 · Wide</option><option>S2 · Dual</option><option>S3 · Triple</option><option>S5 · Command Center</option></select><button id="newAgent">+ Агент-проект</button><button id="reset">Reset</button></div></header>
<div class="status"><span>FATHER v0.3</span><span id="count"></span><span id="sel">SELECT: none</span><span class="ok">CORE PROTECTED</span></div>
<main class="shell">
<aside class="panel side"><div class="tabs" id="tabs"><button class="active" data-tab="father">FATHER</button><button data-tab="projects">Проекты</button><button data-tab="integrations">Интеграции</button><button data-tab="delivery">DevOps / Security</button></div><div class="search"><input id="q" placeholder="Найти агента / запчасть..."></div><div id="catalog" class="catalog"></div></aside>
<section class="panel canvas"><div class="canvasbar"><div><small id="canvasEyebrow">VISUAL ECOSYSTEM FIELD</small><h1 id="canvasTitle">FATHER Project Canvas</h1><div class="breadcrumb"><button id="backRoot" style="display:none">← Экосистема</button><span id="crumb">ROOT / ECOSYSTEM</span></div></div><div><button id="in">+ INPUT</button><button id="out">+ OUTPUT</button><button id="fit">Разложить</button></div></div><div id="view" class="view"><svg id="svg" class="wires"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#6daeff"/></marker></defs></svg><div id="world" class="world"></div></div></section>
<aside class="panel ins"><div class="inshead"><div><small>AGENT / COMPONENT INSPECTOR</small><h2 id="it">Ничего не выбрано</h2></div></div><div id="ib" class="insbody">Выбери агента, компонент или интеграцию.</div></aside>
<section class="panel bottom"><div class="btabs" id="btabs"><button class="active" data-b="structure">Структура</button><button data-b="contracts">I/O & API</button><button data-b="events">События</button><button data-b="governance">Governance</button></div><div id="bb" class="bbody"></div></section>
</main>
<dialog id="dlg"><h3>Новый агент-проект</h3><label>Название<input id="an"></label><label>Назначение<textarea id="ar"></textarea></label><div class="btnrow"><button id="create">Создать</button><button onclick="dlg.close()">Отмена</button></div></dialog>
<script>
const core=[
['FTH-CORE-ORCHESTRATOR-001','FATHER Factory Orchestrator','F','Главный диспетчер фабрики'],
['FTH-ALINA-ANALYST-001','Алина · Analyst Black Box','A','Главный производственник знаний; здесь только внешний контракт'],
['FTH-DOMAIN-MODELER-001','Domain / Action Modeler','DM','Domain Graph, Action Graph, Decision Graph'],
['FTH-CAPABILITY-MAPPER-001','Capability Mapper','CM','Требования и действия → способности'],
['FTH-COMPOSER-001','Agent Composer','CP','Сборка аппарата из совместимых компонентов'],
['FTH-HARVESTER-001','Legacy / Project Harvester','HV','Разбор существующих проектов на детали и блоки'],
['FTH-CERTIFIER-001','Certification Agent','CT','Паспорт, нормы, тесты, evidence'],
['FTH-TRACE-001','Traceability Agent','TR','Requirement → architecture → component → test → evidence']
].map(x=>({id:x[0],name:x[1],icon:x[2],role:x[3],kind:'agent',core:true,status:x[0].includes('ALINA')?'EXTERNAL_BLACKBOX':'DESIGN'}));
const projects=[
['PRJ-OSINT-001','FATHER OSINT','OS','OSINT, provenance, evidence, graph investigations','osint'],
['PRJ-AISOC-001','FATHER AI-SOC','SOC','SOC-аналитика и расследования','security'],
['PRJ-SECGRAPH-001','SecGraph','SG','Threat Modeling + OSINT + Pentest + Document Engine','security'],
['PRJ-ALINA-CREATIVE-001','Алина · Creative Production','AC','Книги, сценарии, изображения и контент','creative'],
['PRJ-AVATAR-001','Avatar Production Agent','AV','Создание и QC аватаров','creative'],
['PRJ-WEB-001','Website Builder & Maintainer','WEB','Создание, аудит и ведение сайтов','web'],
['PRJ-GAME-001','Game Development Agent','GAME','Игры и интерактивные прототипы','games'],
['PRJ-PROTOTYPE-001','Prototype Engineering Agent','POC','PoC, стенды и reference builds','prototype'],
['PRJ-COURSE-HARVESTER-001','Course Harvester / Lesson Agent','EDU','Последовательно проходит материалы уроков, документирует, анализирует и пополняет БЗ','course'],
['PRJ-COURSE-EDITOR-001','Course Update / Curriculum Agent','CUR','Готовит обновления курса и передаёт Алине/эксперту','course'],
['PRJ-DEVOPS-001','DevOps Agent','DO','CI/CD, containers, environments','devops'],
['PRJ-DEVSECOPS-001','DevSecOps Agent','DS','SAST/SCA/secrets/SBOM/container/K8s security','devsecops'],
['PRJ-K8S-001','Platform / Kubernetes Agent','K8S','Kubernetes, Helm, GitOps, rollout','kubernetes'],
['PRJ-SECARCH-001','Security Architect Agent','SA','Threat model, controls, IAM, guardrails','security'],
['PRJ-COMPLIANCE-001','Compliance Agent','CMP','Нормативка, applicability, controls, evidence','compliance'],
['PRJ-QA-EVAL-001','QA / AI Eval Agent','QA','Tests, AI/RAG eval, quality gates','qa'],
['PRJ-OBS-001','Observability / SRE Agent','OBS','Logs, metrics, traces, SLO, incidents','observability']
].map(x=>({id:x[0],name:x[1],icon:x[2],role:x[3],tag:x[4],kind:'agent',core:false,status:'ACTIVE'}));
const ints=[
['INT-OPENAI-API','OpenAI / GPT API','GPT','OpenAI','LLM / API'],['INT-OPENAI-TOOLS','OpenAI Tools / Connectors','OA','OpenAI','Tools'],['INT-GOOGLE-GEMINI','Google Gemini / Vertex AI','G','Google','LLM / Cloud AI'],['INT-GOOGLE-DRIVE','Google Drive / Docs','GD','Google','Knowledge / Files'],['INT-GOOGLE-SHEETS','Google Sheets','GS','Google','Data'],['INT-GOOGLE-GMAIL','Gmail','GM','Google','Mail'],['INT-GOOGLE-CALENDAR','Google Calendar','GC','Google','Calendar'],['INT-GOOGLE-YOUTUBE','YouTube / Video Sources','YT','Google','Media / Course Source'],['INT-GCP','Google Cloud Platform','GCP','Google','Cloud'],['INT-AZURE-OPENAI','Azure OpenAI','AZ','Microsoft','LLM / Cloud AI'],['INT-AZURE','Microsoft Azure','MS','Microsoft','Cloud'],['INT-GITHUB','GitHub','GH','GitHub','SCM / DevOps'],['INT-GITLAB','GitLab','GL','GitLab','SCM / DevOps'],['INT-ANTHROPIC','Anthropic Claude API','CL','Anthropic','LLM / API'],['INT-OLLAMA','Ollama / Local Models','OL','Local','LLM Runtime'],['INT-POSTGRES','PostgreSQL / pgvector','PG','Data','DB / Vector'],['INT-NEO4J','Neo4j / Graph DB','N4J','Data','Graph'],['INT-MCP','MCP Tool Runtime','MCP','Protocol','Tools']
].map(x=>({id:x[0],name:x[1],icon:x[2],provider:x[3],role:x[4],kind:'integration',status:'CANDIDATE'}));

const folderDefs=[
{id:'identity',name:'Identity / Passport',icon:'ID',role:'ID, версия, назначение, maturity, owner, lifecycle'},
{id:'prompt',name:'Prompt / Policy',icon:'P',role:'System prompt, policies, output contract'},
{id:'knowledge',name:'Knowledge Base',icon:'KB',role:'Доменные знания, документы, нормативка'},
{id:'rag',name:'RAG / Retrieval',icon:'R',role:'Retrieval, reranking, context, citations'},
{id:'database',name:'Databases / State',icon:'DB',role:'Operational state, SQL/NoSQL/vector/graph'},
{id:'memory',name:'Memory',icon:'M',role:'Working, episodic, project memory'},
{id:'tools',name:'Tools / MCP / API',icon:'T',role:'Инструменты, MCP, API, external actions'},
{id:'workflow',name:'Workflow / Graph',icon:'WF',role:'Маршрутизация, graph/state machine, orchestration'},
{id:'security',name:'Security / Guardrails',icon:'SEC',role:'IAM, permissions, PII, guardrails, tool authorization',cls:'security-folder'},
{id:'eval',name:'Tests / Eval',icon:'QA',role:'Unit/contract/AI/RAG eval, quality gates'},
{id:'observability',name:'Observability',icon:'OBS',role:'Logs, metrics, traces, audit, SLO'},
{id:'deployment',name:'Deployment / Runtime',icon:'DEP',role:'Container, K8s, Helm, GitOps, runtime'},
{id:'docs',name:'Documentation',icon:'DOC',role:'Architecture, ADR, API, operating docs'},
{id:'evidence',name:'Evidence / History',icon:'EV',role:'Evidence, test history, production history',cls:'evidence-folder'}
];
const folders=folderDefs.map((f,i)=>String(i).padStart(2,'0')+' · '+f.name);

let S=JSON.parse(localStorage.getItem('father-v03')||'{"custom":[],"arch":[],"nodes":[],"edges":[],"events":[]}');
S.custom=S.custom||[];S.arch=S.arch||[];S.nodes=S.nodes||[];S.edges=S.edges||[];S.events=S.events||[];S.agentGraphs=S.agentGraphs||{};
let tab='father',bottom='structure',selected=null,pending=null,drag=null,view={mode:'root',agentId:null};
const $=s=>document.querySelector(s),$=s=>[...document.querySelectorAll(s)],save=()=>{localStorage.setItem('father-v03',JSON.stringify(S));stats()},all=()=>[...core,...projects,...S.custom];
function ev(k,m){S.events.unshift({t:new Date().toISOString(),k,m});save()}
function list(){if(tab==='father')return core;if(tab==='projects')return [...projects,...S.custom];if(tab==='integrations')return ints;return [...projects,...S.custom].filter(a=>['devops','devsecops','kubernetes','security','compliance','qa','observability'].includes(a.tag))}
function renderCatalog(){let q=$('#q').value.toLowerCase(),a=list().filter(x=>(x.id+x.name+x.role).toLowerCase().includes(q));$('#catalog').innerHTML='<div class="group">'+({father:'АГЕНТЫ ВНУТРИ FATHER',projects:'АГЕНТЫ КАК ПРОЕКТЫ',integrations:'ЗАПЧАСТИ / ИНТЕГРАЦИИ',delivery:'DEVOPS / SECURITY ECOSYSTEM'}[tab])+'</div>'+a.map(x=>'<div class="item '+(x.core?'core ':'')+(S.arch.includes(x.id)?'arch':'')+'" draggable="true" data-id="'+x.id+'" data-kind="'+x.kind+'"><span class="ico">'+x.icon+'</span><span><b>'+x.name+'</b><small>'+x.id+' · '+x.status+'</small></span></div>').join('');$('.item').forEach(e=>{e.ondragstart=v=>v.dataTransfer.setData('father',JSON.stringify({id:e.dataset.id,kind:e.dataset.kind}));e.onclick=()=>select(e.dataset.kind,e.dataset.id);e.ondblclick=()=>{if(e.dataset.kind==='agent')openAgent(e.dataset.id)}})}
function entity(k,id){if(k==='integration')return ints.find(x=>x.id===id);if(k==='folder')return folderDefs.find(x=>x.id===id);return all().find(x=>x.id===id)}
function select(k,id){selected={k,id};$('#sel').textContent='SELECT: '+id;renderInspector()}
function renderInspector(){
 if(!selected){$('#it').textContent='Ничего не выбрано';$('#ib').textContent='Выбери агента, компонент или интеграцию.';return}
 let x=entity(selected.k,selected.id);if(!x)return;$('#it').textContent=x.name;
 if(selected.k==='folder'){
   const agent=all().find(a=>a.id===view.agentId);
   $('#ib').innerHTML='<div class="cards"><div class="card"><small>NODE</small><b>'+x.id+'</b></div><div class="card"><small>AGENT</small><b>'+(agent?.name||'')+'</b></div><div class="card"><small>STATUS</small><b>STRUCTURE</b></div><div class="card"><small>CONTENT</small><b>TBD / HARVEST</b></div></div><div class="sec"><h3>PURPOSE</h3><div class="folder">'+x.role+'</div></div><div class="sec"><h3>PATH</h3><div class="folder"><b>'+view.agentId+'/'+x.id+'/</b><small>Следующая волна — привязка реальных файлов, компонентов и evidence.</small></div></div>';return
 }
 if(x.kind==='integration'){
   $('#ib').innerHTML='<div class="cards"><div class="card"><small>ID</small><b>'+x.id+'</b></div><div class="card"><small>PROVIDER</small><b>'+x.provider+'</b></div><div class="card"><small>TYPE</small><b>'+x.role+'</b></div><div class="card"><small>STATUS</small><b>'+x.status+'</b></div></div><div class="sec"><h3>CONTRACT</h3><div class="folder"><b>Adapter contract</b><small>Credentials/secrets are not stored here.</small></div></div><div class="btnrow"><button onclick="addNode(\'integration\',\''+x.id+'\')">На поле</button></div>';return
 }
 let acts=x.core?'':'<button onclick="archive(\''+x.id+'\')">'+(S.arch.includes(x.id)?'Вернуть':'Архивировать')+'</button>';
 $('#ib').innerHTML='<div class="cards"><div class="card"><small>ID</small><b>'+x.id+'</b></div><div class="card"><small>CLASS</small><b>'+(x.core?'FATHER CORE':'PROJECT AGENT')+'</b></div><div class="card"><small>STATUS</small><b>'+x.status+'</b></div><div class="card"><small>PROTECTED</small><b>'+(x.core?'YES':'NO')+'</b></div></div><div class="sec"><h3>ROLE</h3><div class="folder">'+x.role+'</div></div><div class="sec"><h3>ВНУТРЕННИЕ ПАПКИ</h3>'+folders.map((f,i)=>'<div class="folder"><b>'+f+'</b><small>'+x.id+'/'+folderDefs[i].id+'/</small></div>').join('')+'</div><div class="btnrow"><button onclick="addNode(\'agent\',\''+x.id+'\')">На поле</button><button onclick="openAgent(\''+x.id+'\')">Открыть внутренности</button>'+acts+'</div>'
}
function archive(id){S.arch.includes(id)?S.arch=S.arch.filter(x=>x!==id):S.arch.push(id);ev('ARCHIVE',id);renderCatalog();renderInspector()}

function graph(){if(view.mode==='agent'){ensureAgentGraph(view.agentId);return S.agentGraphs[view.agentId]}return{nodes:S.nodes,edges:S.edges}}
function ensureAgentGraph(agentId){
 if(S.agentGraphs[agentId])return;
 const alina=agentId==='FTH-ALINA-ANALYST-001';
 if(alina){
   S.agentGraphs[agentId]={nodes:[
     {nid:'AL-IN',k:'folder',id:'identity',x:80,y:150,label:'Input Contract',icon:'IN',role:'research_brief / task / constraints',blackbox:true},
     {nid:'AL-BB',k:'folder',id:'workflow',x:390,y:150,label:'ALINA BLACK BOX',icon:'A',role:'Внутренняя реализация ведётся в соседней ветке и здесь не раскрывается.',blackbox:true},
     {nid:'AL-OUT',k:'folder',id:'evidence',x:720,y:150,label:'Output Contract',icon:'OUT',role:'knowledge_pack / evidence_bundle / status_events',blackbox:true}
   ],edges:[
     {from:'AL-IN',to:'AL-BB',type:'CONTRACT',contract:'research_brief'},
     {from:'AL-BB',to:'AL-OUT',type:'CONTRACT',contract:'knowledge_pack + evidence'}
   ]};save();return
 }
 const pos={identity:[60,60],prompt:[300,60],knowledge:[300,215],rag:[540,215],database:[300,370],memory:[540,370],tools:[780,370],workflow:[780,95],security:[1020,95],eval:[1260,95],observability:[1260,275],deployment:[1500,95],docs:[1500,275],evidence:[1500,445]};
 const nodes=folderDefs.map(f=>({nid:'F-'+f.id,k:'folder',id:f.id,x:pos[f.id][0],y:pos[f.id][1]}));
 const links=[['identity','prompt'],['identity','knowledge'],['knowledge','rag'],['prompt','workflow'],['rag','workflow'],['database','memory'],['memory','workflow'],['workflow','tools'],['tools','workflow'],['workflow','security'],['security','eval'],['eval','observability'],['observability','deployment'],['eval','docs'],['eval','evidence'],['observability','evidence']];
 S.agentGraphs[agentId]={nodes,edges:links.map((x,i)=>({from:'F-'+x[0],to:'F-'+x[1],type:'INTERNAL',contract:'TBD-'+String(i+1).padStart(2,'0')}))};save()
}
function openAgent(id){
 if(S.arch.includes(id))return alert('Агент в архиве');
 ensureAgentGraph(id);view={mode:'agent',agentId:id};selected={k:'agent',id};pending=null;updateCanvasContext();renderCanvas();renderInspector();renderBottom();ev('DRILLDOWN','OPEN '+id)
}
function backRoot(){view={mode:'root',agentId:null};selected=null;pending=null;updateCanvasContext();renderCanvas();renderInspector();renderBottom()}
function updateCanvasContext(){
 const btn=$('#backRoot');
 if(view.mode==='agent'){const a=all().find(x=>x.id===view.agentId);$('#canvasEyebrow').textContent='AGENT INTERNAL ARCHITECTURE';$('#canvasTitle').textContent=a?.name||view.agentId;$('#crumb').textContent='ROOT / AGENTS / '+view.agentId;btn.style.display='inline-block';$('#in').style.display='none';$('#out').style.display='none'}
 else{$('#canvasEyebrow').textContent='VISUAL ECOSYSTEM FIELD';$('#canvasTitle').textContent='FATHER Project Canvas';$('#crumb').textContent='ROOT / ECOSYSTEM';btn.style.display='none';$('#in').style.display='inline-block';$('#out').style.display='inline-block'}
}

function addNode(k,id,x=350,y=180){
 if(S.arch.includes(id))return alert('Агент в архиве');
 const g=graph();
 if(view.mode==='agent'&&k==='agent')return alert('Внутри агента добавляйте интеграционные запчасти; агент как проект размещается на корневом поле.');
 g.nodes.push({nid:'N'+Date.now()+Math.random(),k,id,x,y});ev('NODE',id);renderCanvas()
}
function nodeEntity(n){
 if(n.k==='io')return{name:n.id,icon:n.id==='INPUT'?'IN':'OUT',role:n.id==='INPUT'?'Вход проекта':'Ожидаемый результат'};
 if(n.k==='folder'){
   const f=folderDefs.find(x=>x.id===n.id)||{};
   return{name:n.label||f.name||n.id,icon:n.icon||f.icon||'□',role:n.role||f.role||'',cls:f.cls||'',blackbox:n.blackbox}
 }
 return entity(n.k,n.id)
}
function renderCanvas(){
 const g=graph();
 $('#world').innerHTML=g.nodes.map(n=>{let x=nodeEntity(n);return '<div class="node '+(x.core?'core ':'')+(n.k==='integration'?'int ':'')+(n.k==='folder'?'foldernode '+(x.cls||''):'')+(x.blackbox?' blackbox':'')+'" data-node="'+n.nid+'" style="left:'+n.x+'px;top:'+n.y+'px"><div class="nh"><span class="ico">'+x.icon+'</span><span><b>'+x.name+'</b><small>'+(n.k==='folder'?(view.agentId+'/'+n.id):n.id)+'</small></span></div><div class="nb">'+x.role+'</div><div class="ports"><span class="port in" data-d="in" data-n="'+n.nid+'"></span><span class="port out" data-d="out" data-n="'+n.nid+'"></span></div></div>'}).join('');
 $('.node').forEach(e=>{e.onmousedown=startDrag;e.onclick=v=>{if(v.target.classList.contains('port'))return;let n=g.nodes.find(x=>x.nid===e.dataset.node);if(!n||n.k==='io')return;select(n.k,n.id)};e.ondblclick=()=>{let n=g.nodes.find(x=>x.nid===e.dataset.node);if(view.mode==='root'&&n?.k==='agent')openAgent(n.id)}});
 $('.port').forEach(p=>p.onclick=connect);draw()
}
function connect(e){
 e.stopPropagation();const g=graph(),id=e.target.dataset.n;
 if(e.target.dataset.d==='out'){pending=id;$('.port.out').forEach(p=>p.classList.toggle('pending',p.dataset.n===id));return}
 if(pending&&pending!==id){g.edges.push({from:pending,to:id,type:view.mode==='agent'?'INTERNAL':'API/DATA',contract:'TBD'});pending=null;ev('EDGE','created');renderCanvas();renderBottom()}
}
function startDrag(e){
 if(e.target.classList.contains('port'))return;let g=graph(),n=g.nodes.find(x=>x.nid===e.currentTarget.dataset.node),r=$('#view').getBoundingClientRect();drag={n,dx:e.clientX-r.left-n.x,dy:e.clientY-r.top-n.y};document.onmousemove=move;document.onmouseup=()=>{document.onmousemove=null;drag=null;save()}
}
function move(e){if(!drag)return;let r=$('#view').getBoundingClientRect();drag.n.x=Math.max(0,e.clientX-r.left-drag.dx);drag.n.y=Math.max(0,e.clientY-r.top-drag.dy);renderCanvas()}
function draw(){
 let g=graph(),s=$('#svg');[...s.querySelectorAll('path')].forEach(x=>x.remove());let vr=$('#view').getBoundingClientRect();
 g.edges.forEach(e=>{let a=document.querySelector('[data-node="'+e.from+'"]'),b=document.querySelector('[data-node="'+e.to+'"]');if(!a||!b)return;let A=a.getBoundingClientRect(),B=b.getBoundingClientRect(),x1=A.right-vr.left,y1=A.top+A.height/2-vr.top,x2=B.left-vr.left,y2=B.top+B.height/2-vr.top,d=Math.max(60,Math.abs(x2-x1)*.45),p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d','M '+x1+' '+y1+' C '+(x1+d)+' '+y1+', '+(x2-d)+' '+y2+', '+x2+' '+y2);s.appendChild(p)})
}
function fit(){let g=graph();g.nodes.forEach((n,i)=>{n.x=50+(i%4)*235;n.y=60+Math.floor(i/4)*150});save();renderCanvas()}
function renderBottom(){
 $('#btabs button').forEach(b=>b.classList.toggle('active',b.dataset.b===bottom));let b=$('#bb'),g=graph();
 if(bottom==='structure'){
   if(view.mode==='agent'){const a=all().find(x=>x.id===view.agentId);b.innerHTML=folderDefs.map((f,i)=>'<div class="row"><span>'+String(i).padStart(2,'0')+'</span><b>'+f.name+'</b><span>'+view.agentId+'/'+f.id+'/ · '+(a?.status||'')+'</span></div>').join('')}
   else b.innerHTML=all().filter(x=>!S.arch.includes(x.id)).map(x=>'<div class="row"><span>'+(x.core?'FATHER CORE':'PROJECT')+'</span><b>'+x.name+'</b><span>'+folders.length+' standard folders · '+x.status+'</span></div>').join('')
 }else if(bottom==='contracts')b.innerHTML=g.edges.map(e=>'<div class="row"><span>'+e.type+'</span><b>'+e.from+' → '+e.to+'</b><span>'+e.contract+'</span></div>').join('')||'<div class="row"><span>NONE</span><b>No edges</b><span>Соедини OUT → IN.</span></div>';
 else if(bottom==='events')b.innerHTML=S.events.slice(0,40).map(e=>'<div class="row"><span>'+e.t.slice(11,19)+'</span><b>'+e.k+'</b><span>'+e.m+'</span></div>').join('');
 else b.innerHTML='<div class="row"><span>CORE</span><b>Protected</b><span>FATHER core нельзя удалить/архивировать.</span></div><div class="row"><span>PROJECT</span><b>Mutable</b><span>Проектные агенты расширяемы и архивируемы.</span></div><div class="row"><span>ALINA</span><b>Black box</b><span>У Алины показывается только input/output contract.</span></div><div class="row"><span>DRILLDOWN</span><b>Agent internals</b><span>Double click по агенту открывает его внутренний canvas.</span></div>'
}
function stats(){$('#count').textContent='CORE '+core.length+' · PROJECT '+([...projects,...S.custom].length)+' · INTEGRATIONS '+ints.length+' · CANVAS '+graph().nodes.length}

$('#tabs').onclick=e=>{let b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;$('#tabs button').forEach(x=>x.classList.toggle('active',x===b));renderCatalog()};
$('#q').oninput=renderCatalog;
$('#newAgent').onclick=()=>dlg.showModal();
$('#create').onclick=()=>{let n=$('#an').value.trim();if(!n)return;S.custom.push({id:'USR-AGENT-'+Date.now(),name:n,icon:'USR',role:$('#ar').value||'Custom project agent',kind:'agent',core:false,status:'DESIGN'});save();dlg.close();tab='projects';renderCatalog();stats()};
$('#reset').onclick=()=>{if(confirm('Reset local workspace state?')){S={custom:[],arch:[],nodes:[],edges:[],events:[],agentGraphs:{}};view={mode:'root',agentId:null};selected=null;save();updateCanvasContext();renderCatalog();renderCanvas();renderInspector();renderBottom()}};
$('#in').onclick=()=>addNode('io','INPUT',50,100);$('#out').onclick=()=>addNode('io','OUTPUT',1050,100);$('#fit').onclick=fit;$('#backRoot').onclick=backRoot;
$('#btabs button').forEach(x=>x.onclick=()=>{bottom=x.dataset.b;renderBottom()});
let v=$('#view');v.ondragover=e=>e.preventDefault();v.ondrop=e=>{e.preventDefault();let a=JSON.parse(e.dataTransfer.getData('father')||'null');if(!a)return;let r=v.getBoundingClientRect();addNode(a.kind,a.id,e.clientX-r.left-95,e.clientY-r.top-40)};
window.onresize=draw;updateCanvasContext();renderCatalog();renderCanvas();renderBottom();stats();
</script>
</body></html>
