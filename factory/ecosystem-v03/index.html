<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FATHER Ecosystem Workspace v0.3</title>
<style>
:root{--bg:#071017;--p:#0b161e;--p2:#0f1d27;--l:#203744;--t:#eef7fc;--m:#829aaa;--c:#4ed9ff;--g:#63e6a5;--v:#a18cff;--r:#ff7474;--b:#6daeff}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--t);font-family:Inter,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}.top{height:58px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--l)}.brand{font-weight:800;letter-spacing:.08em}.brand small{display:block;color:var(--m);font-size:9px;font-weight:500}.actions{display:flex;gap:6px}.actions button,.actions select,.canvasbar button{border:1px solid var(--l);background:#0b1720;color:var(--t);border-radius:8px;padding:7px 9px;font-size:9px}.status{height:29px;padding:0 14px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--l);font:9px Consolas;color:var(--m)}.status .ok{margin-left:auto;color:var(--g)}.shell{height:calc(100vh - 87px);padding:8px;display:grid;grid-template-columns:310px minmax(620px,1fr) 360px;grid-template-rows:minmax(0,1fr) 190px;gap:8px}.panel{border:1px solid var(--l);border-radius:12px;background:linear-gradient(145deg,#0d1922,#091219);overflow:hidden}.side{grid-row:1/3}.canvas{grid-column:2}.ins{grid-column:3}.bottom{grid-column:2/4}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:7px;border-bottom:1px solid var(--l)}.tabs button,.btabs button{border:1px solid var(--l);background:#09131a;color:var(--m);border-radius:7px;padding:6px 3px;font-size:8px}.tabs button.active,.btabs button.active{color:var(--c);border-color:var(--c)}.search{padding:7px;border-bottom:1px solid var(--l)}.search input{width:100%;padding:7px;background:#071219;color:var(--t);border:1px solid var(--l);border-radius:8px}.catalog{height:calc(100% - 80px);overflow:auto;padding:7px}.group{font-size:8px;color:var(--c);letter-spacing:.12em;margin:10px 4px 5px}.item{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--l);border-radius:9px;background:#09141b;margin:5px 0;cursor:grab}.item.core{border-left:3px solid var(--v)}.item.arch{opacity:.4}.ico{width:31px;height:31px;border:1px solid #2e4b5a;border-radius:8px;display:grid;place-items:center;background:#12232d;font:bold 8px Consolas}.item b{font-size:9px}.item small{display:block;color:var(--m);font-size:7px;margin-top:2px}.canvasbar,.inshead{height:60px;padding:9px 11px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between}.canvasbar small,.inshead small{color:var(--c);font-size:8px;letter-spacing:.12em}.canvasbar h1,.inshead h2{font-size:13px;margin:3px 0}.view{position:relative;height:calc(100% - 60px);overflow:hidden;background-color:#071017;background-image:linear-gradient(#10232d 1px,transparent 1px),linear-gradient(90deg,#10232d 1px,transparent 1px);background-size:28px 28px}.world{position:absolute;inset:0}.wires{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}.wires path{fill:none;stroke:var(--b);stroke-width:2;marker-end:url(#arr)}.node{position:absolute;width:200px;border:1px solid #2b4858;border-radius:11px;background:#0b1720;z-index:3;box-shadow:0 14px 32px #0007;user-select:none}.node.core{border-color:#6556a7}.node.int{border-color:#38645b}.nh{display:flex;gap:8px;align-items:center;padding:8px 9px;border-bottom:1px solid #19303d;cursor:move}.nh b{font-size:9px}.nh small{display:block;color:var(--m);font-size:7px}.nb{padding:8px 9px;color:var(--m);font-size:8px;line-height:1.35}.ports{padding:0 8px 8px;display:flex;justify-content:space-between}.port{width:12px;height:12px;border:2px solid #658091;border-radius:50%;background:#071017;display:inline-block;cursor:crosshair}.port.pending{border-color:var(--c);box-shadow:0 0 8px var(--c)}.insbody{height:calc(100% - 60px);overflow:auto;padding:10px;color:var(--m);font-size:9px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}.card{border:1px solid var(--l);border-radius:8px;padding:7px;background:#08131a}.card small{display:block;color:var(--m);font-size:7px}.card b{font-size:9px;color:var(--t)}.sec{margin:11px 0}.sec h3{font-size:8px;color:var(--c);letter-spacing:.1em}.folder{border:1px solid var(--l);border-radius:8px;padding:7px;margin:5px 0;background:#09141b}.folder b{font-size:8px;color:var(--t)}.folder small{display:block;font-size:7px}.btnrow{display:flex;gap:5px;flex-wrap:wrap}.btnrow button{border:1px solid var(--l);background:#0a161d;color:var(--t);padding:6px 8px;border-radius:7px;font-size:8px}.btabs{height:39px;display:flex;gap:4px;padding:7px;border-bottom:1px solid var(--l)}.bbody{height:calc(100% - 39px);overflow:auto;padding:8px;font:9px Consolas;color:#a9c1cf}.row{display:grid;grid-template-columns:140px 220px 1fr;gap:8px;padding:5px 2px;border-bottom:1px dashed #16313d}.row b{color:var(--t)}dialog{border:1px solid var(--l);background:#09141b;color:var(--t);border-radius:12px;width:min(600px,90vw)}dialog::backdrop{background:#0009}dialog label{display:block;font-size:9px;color:var(--m);margin:8px 0}dialog input,dialog textarea{width:100%;margin-top:5px;padding:8px;background:#061017;color:var(--t);border:1px solid var(--l);border-radius:8px}dialog textarea{min-height:80px}@media(max-width:1200px){.shell{grid-template-columns:260px 1fr;grid-template-rows:minmax(430px,1fr) 300px 190px}.side{grid-row:1/4}.canvas{grid-column:2}.ins{grid-column:2;grid-row:2}.bottom{grid-column:2;grid-row:3}}
</style>
</head>
<body>
<header class="top"><div class="brand">FATHER ECOSYSTEM WORKSPACE<small>Agents · Components · Integrations · Knowledge · Delivery</small></div><div class="actions"><select id="layout"><option>S1 · Wide</option><option>S2 · Dual</option><option>S3 · Triple</option><option>S5 · Command Center</option></select><button id="newAgent">+ Агент-проект</button><button id="reset">Reset</button></div></header>
<div class="status"><span>FATHER v0.3</span><span id="count"></span><span id="sel">SELECT: none</span><span class="ok">CORE PROTECTED</span></div>
<main class="shell">
<aside class="panel side"><div class="tabs" id="tabs"><button class="active" data-tab="father">FATHER</button><button data-tab="projects">Проекты</button><button data-tab="integrations">Интеграции</button><button data-tab="delivery">DevOps / Security</button></div><div class="search"><input id="q" placeholder="Найти агента / запчасть..."></div><div id="catalog" class="catalog"></div></aside>
<section class="panel canvas"><div class="canvasbar"><div><small>VISUAL ECOSYSTEM FIELD</small><h1>FATHER Project Canvas</h1></div><div><button id="in">+ INPUT</button><button id="out">+ OUTPUT</button><button id="fit">Разложить</button></div></div><div id="view" class="view"><svg id="svg" class="wires"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#6daeff"/></marker></defs></svg><div id="world" class="world"></div></div></section>
<aside class="panel ins"><div class="inshead"><div><small>AGENT / COMPONENT INSPECTOR</small><h2 id="it">Ничего не выбрано</h2></div></div><div id="ib" class="insbody">Выбери агента, компонент или интеграцию.</div></aside>
<section class="panel bottom"><div class="btabs" id="btabs"><button class="active" data-b="structure">Структура</button><button data-b="contracts">I/O & API</button><button data-b="events">События</button><button data-b="governance">Governance</button></div><div id="bb" class="bbody"></div></section>
</main>
<dialog id="dlg"><h3>Новый агент-проект</h3><label>Название<input id="an"></label><label>Назначение<textarea id="ar"></textarea></label><div class="btnrow"><button id="create">Создать</button><button onclick="dlg.close()">Отмена</button></div></dialog>
<script>
const core=[
['FTH-CORE-ORCHESTRATOR-001','FATHER Factory Orchestrator','F','Главный диспетчер фабрики'],
['FTH-ALINA-ANALYST-001','Алина · Analyst Black Box','A','Главный производственник знаний; здесь только внешний контракт'],
['FTH-DOMAIN-MODELER-001','Domain / Action Modeler','DM','Domain Graph, Action Graph, Decision Graph'],
['FTH-CAPABILITY-MAPPER-001','Capability Mapper','CM','Требования и действия → способности'],
['FTH-COMPOSER-001','Agent Composer','CP','Сборка аппарата из совместимых компонентов'],
['FTH-HARVESTER-001','Legacy / Project Harvester','HV','Разбор существующих проектов на детали и блоки'],
['FTH-CERTIFIER-001','Certification Agent','CT','Паспорт, нормы, тесты, evidence'],
['FTH-TRACE-001','Traceability Agent','TR','Requirement → architecture → component → test → evidence']
].map(x=>({id:x[0],name:x[1],icon:x[2],role:x[3],kind:'agent',core:true,status:x[0].includes('ALINA')?'EXTERNAL_BLACKBOX':'DESIGN'}));
const projects=[
['PRJ-OSINT-001','FATHER OSINT','OS','OSINT, provenance, evidence, graph investigations','osint'],
['PRJ-AISOC-001','FATHER AI-SOC','SOC','SOC-аналитика и расследования','security'],
['PRJ-SECGRAPH-001','SecGraph','SG','Threat Modeling + OSINT + Pentest + Document Engine','security'],
['PRJ-ALINA-CREATIVE-001','Алина · Creative Production','AC','Книги, сценарии, изображения и контент','creative'],
['PRJ-AVATAR-001','Avatar Production Agent','AV','Создание и QC аватаров','creative'],
['PRJ-WEB-001','Website Builder & Maintainer','WEB','Создание, аудит и ведение сайтов','web'],
['PRJ-GAME-001','Game Development Agent','GAME','Игры и интерактивные прототипы','games'],
['PRJ-PROTOTYPE-001','Prototype Engineering Agent','POC','PoC, стенды и reference builds','prototype'],
['PRJ-COURSE-HARVESTER-001','Course Harvester / Lesson Agent','EDU','Последовательно проходит материалы уроков, документирует, анализирует и пополняет БЗ','course'],
['PRJ-COURSE-EDITOR-001','Course Update / Curriculum Agent','CUR','Готовит обновления курса и передаёт Алине/эксперту','course'],
['PRJ-DEVOPS-001','DevOps Agent','DO','CI/CD, containers, environments','devops'],
['PRJ-DEVSECOPS-001','DevSecOps Agent','DS','SAST/SCA/secrets/SBOM/container/K8s security','devsecops'],
['PRJ-K8S-001','Platform / Kubernetes Agent','K8S','Kubernetes, Helm, GitOps, rollout','kubernetes'],
['PRJ-SECARCH-001','Security Architect Agent','SA','Threat model, controls, IAM, guardrails','security'],
['PRJ-COMPLIANCE-001','Compliance Agent','CMP','Нормативка, applicability, controls, evidence','compliance'],
['PRJ-QA-EVAL-001','QA / AI Eval Agent','QA','Tests, AI/RAG eval, quality gates','qa'],
['PRJ-OBS-001','Observability / SRE Agent','OBS','Logs, metrics, traces, SLO, incidents','observability']
].map(x=>({id:x[0],name:x[1],icon:x[2],role:x[3],tag:x[4],kind:'agent',core:false,status:'ACTIVE'}));
const ints=[
['INT-OPENAI-API','OpenAI / GPT API','GPT','OpenAI','LLM / API'],['INT-OPENAI-TOOLS','OpenAI Tools / Connectors','OA','OpenAI','Tools'],['INT-GOOGLE-GEMINI','Google Gemini / Vertex AI','G','Google','LLM / Cloud AI'],['INT-GOOGLE-DRIVE','Google Drive / Docs','GD','Google','Knowledge / Files'],['INT-GOOGLE-SHEETS','Google Sheets','GS','Google','Data'],['INT-GOOGLE-GMAIL','Gmail','GM','Google','Mail'],['INT-GOOGLE-CALENDAR','Google Calendar','GC','Google','Calendar'],['INT-GOOGLE-YOUTUBE','YouTube / Video Sources','YT','Google','Media / Course Source'],['INT-GCP','Google Cloud Platform','GCP','Google','Cloud'],['INT-AZURE-OPENAI','Azure OpenAI','AZ','Microsoft','LLM / Cloud AI'],['INT-AZURE','Microsoft Azure','MS','Microsoft','Cloud'],['INT-GITHUB','GitHub','GH','GitHub','SCM / DevOps'],['INT-GITLAB','GitLab','GL','GitLab','SCM / DevOps'],['INT-ANTHROPIC','Anthropic Claude API','CL','Anthropic','LLM / API'],['INT-OLLAMA','Ollama / Local Models','OL','Local','LLM Runtime'],['INT-POSTGRES','PostgreSQL / pgvector','PG','Data','DB / Vector'],['INT-NEO4J','Neo4j / Graph DB','N4J','Data','Graph'],['INT-MCP','MCP Tool Runtime','MCP','Protocol','Tools']
].map(x=>({id:x[0],name:x[1],icon:x[2],provider:x[3],role:x[4],kind:'integration',status:'CANDIDATE'}));
const folders=['00 · Identity / Passport','01 · Prompt / Policy','02 · Knowledge Base','03 · RAG / Retrieval','04 · Databases / State','05 · Memory','06 · Tools / MCP / API','07 · Workflow / Graph','08 · Security / Guardrails','09 · Tests / Eval','10 · Observability','11 · Deployment / Runtime','12 · Documentation','13 · Evidence / History'];
let S=JSON.parse(localStorage.getItem('father-v03')||'{"custom":[],"arch":[],"nodes":[],"edges":[],"events":[]}'),tab='father',bottom='structure',selected=null,pending=null,drag=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],save=()=>{localStorage.setItem('father-v03',JSON.stringify(S));stats()},all=()=>[...core,...projects,...S.custom];
function ev(k,m){S.events.unshift({t:new Date().toISOString(),k,m});save()}
function list(){if(tab==='father')return core;if(tab==='projects')return [...projects,...S.custom];if(tab==='integrations')return ints;return [...projects,...S.custom].filter(a=>['devops','devsecops','kubernetes','security','compliance','qa','observability'].includes(a.tag))}
function renderCatalog(){let q=$('#q').value.toLowerCase(),a=list().filter(x=>(x.id+x.name+x.role).toLowerCase().includes(q));$('#catalog').innerHTML='<div class="group">'+({father:'АГЕНТЫ ВНУТРИ FATHER',projects:'АГЕНТЫ КАК ПРОЕКТЫ',integrations:'ЗАПЧАСТИ / ИНТЕГРАЦИИ',delivery:'DEVOPS / SECURITY ECOSYSTEM'}[tab])+'</div>'+a.map(x=>'<div class="item '+(x.core?'core ':'')+(S.arch.includes(x.id)?'arch':'')+'" draggable="true" data-id="'+x.id+'" data-kind="'+x.kind+'"><span class="ico">'+x.icon+'</span><span><b>'+x.name+'</b><small>'+x.id+' · '+x.status+'</small></span></div>').join('');$$('.item').forEach(e=>{e.ondragstart=v=>v.dataTransfer.setData('father',JSON.stringify({id:e.dataset.id,kind:e.dataset.kind}));e.onclick=()=>select(e.dataset.kind,e.dataset.id)})}
function entity(k,id){return k==='integration'?ints.find(x=>x.id===id):all().find(x=>x.id===id)}
function select(k,id){selected={k,id};$('#sel').textContent='SELECT: '+id;renderInspector()}
function renderInspector(){if(!selected){$('#it').textContent='Ничего не выбрано';$('#ib').textContent='Выбери агента, компонент или интеграцию.';return}let x=entity(selected.k,selected.id);if(!x)return;$('#it').textContent=x.name;if(x.kind==='integration'){$('#ib').innerHTML='<div class="cards"><div class="card"><small>ID</small><b>'+x.id+'</b></div><div class="card"><small>PROVIDER</small><b>'+x.provider+'</b></div><div class="card"><small>TYPE</small><b>'+x.role+'</b></div><div class="card"><small>STATUS</small><b>'+x.status+'</b></div></div><div class="sec"><h3>CONTRACT</h3><div class="folder"><b>Adapter contract</b><small>Credentials/secrets are not stored here.</small></div></div><div class="btnrow"><button onclick="addNode(\'integration\',\''+x.id+'\')">На поле</button></div>';return}let acts=x.core?'':'<button onclick="archive(\''+x.id+'\')">'+(S.arch.includes(x.id)?'Вернуть':'Архивировать')+'</button>';$('#ib').innerHTML='<div class="cards"><div class="card"><small>ID</small><b>'+x.id+'</b></div><div class="card"><small>CLASS</small><b>'+(x.core?'FATHER CORE':'PROJECT AGENT')+'</b></div><div class="card"><small>STATUS</small><b>'+x.status+'</b></div><div class="card"><small>PROTECTED</small><b>'+(x.core?'YES':'NO')+'</b></div></div><div class="sec"><h3>ROLE</h3><div class="folder">'+x.role+'</div></div><div class="sec"><h3>ВНУТРЕННИЕ ПАПКИ</h3>'+folders.map(f=>'<div class="folder"><b>'+f+'</b><small>'+x.id+'/'+f.split(' · ')[0]+'/</small></div>').join('')+'</div><div class="btnrow"><button onclick="addNode(\'agent\',\''+x.id+'\')">На поле</button>'+acts+'</div>'}
function archive(id){S.arch.includes(id)?S.arch=S.arch.filter(x=>x!==id):S.arch.push(id);ev('ARCHIVE',id);renderCatalog();renderInspector()}
function addNode(k,id,x=350,y=180){if(S.arch.includes(id))return alert('Агент в архиве');S.nodes.push({nid:'N'+Date.now()+Math.random(),k,id,x,y});ev('NODE',id);renderCanvas()}
function nodeEntity(n){if(n.k==='io')return{name:n.id,icon:n.id==='INPUT'?'IN':'OUT',role:n.id==='INPUT'?'Вход проекта':'Ожидаемый результат'};return entity(n.k,n.id)}
function renderCanvas(){$('#world').innerHTML=S.nodes.map(n=>{let x=nodeEntity(n);return '<div class="node '+(x.core?'core ':'')+(n.k==='integration'?'int':'')+'" data-node="'+n.nid+'" style="left:'+n.x+'px;top:'+n.y+'px"><div class="nh"><span class="ico">'+x.icon+'</span><span><b>'+x.name+'</b><small>'+n.id+'</small></span></div><div class="nb">'+x.role+'</div><div class="ports"><span class="port in" data-d="in" data-n="'+n.nid+'"></span><span class="port out" data-d="out" data-n="'+n.nid+'"></span></div></div>'}).join('');$$('.node').forEach(e=>{e.onmousedown=startDrag;e.onclick=v=>{if(v.target.classList.contains('port'))return;let n=S.nodes.find(x=>x.nid===e.dataset.node);if(n&&n.k!=='io')select(n.k,n.id)}});$$('.port').forEach(p=>p.onclick=connect);draw()}
function connect(e){e.stopPropagation();let id=e.target.dataset.n;if(e.target.dataset.d==='out'){pending=id;$$('.port.out').forEach(p=>p.classList.toggle('pending',p.dataset.n===id));return}if(pending&&pending!==id){S.edges.push({from:pending,to:id,type:'API/DATA',contract:'TBD'});pending=null;ev('EDGE','created');renderCanvas();renderBottom()}}
function startDrag(e){if(e.target.classList.contains('port'))return;let n=S.nodes.find(x=>x.nid===e.currentTarget.dataset.node),r=$('#view').getBoundingClientRect();drag={n,dx:e.clientX-r.left-n.x,dy:e.clientY-r.top-n.y};document.onmousemove=move;document.onmouseup=()=>{document.onmousemove=null;drag=null;save()}}
function move(e){if(!drag)return;let r=$('#view').getBoundingClientRect();drag.n.x=Math.max(0,e.clientX-r.left-drag.dx);drag.n.y=Math.max(0,e.clientY-r.top-drag.dy);renderCanvas()}
function draw(){let s=$('#svg');[...s.querySelectorAll('path')].forEach(x=>x.remove());let vr=$('#view').getBoundingClientRect();S.edges.forEach(e=>{let a=document.querySelector('[data-node="'+e.from+'"]'),b=document.querySelector('[data-node="'+e.to+'"]');if(!a||!b)return;let A=a.getBoundingClientRect(),B=b.getBoundingClientRect(),x1=A.right-vr.left,y1=A.top+A.height/2-vr.top,x2=B.left-vr.left,y2=B.top+B.height/2-vr.top,d=Math.max(60,Math.abs(x2-x1)*.45),p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d','M '+x1+' '+y1+' C '+(x1+d)+' '+y1+', '+(x2-d)+' '+y2+', '+x2+' '+y2);s.appendChild(p)})}
function fit(){S.nodes.forEach((n,i)=>{n.x=50+(i%4)*235;n.y=60+Math.floor(i/4)*150});save();renderCanvas()}
function renderBottom(){$$('#btabs button').forEach(b=>b.classList.toggle('active',b.dataset.b===bottom));let b=$('#bb');if(bottom==='structure')b.innerHTML=all().filter(x=>!S.arch.includes(x.id)).map(x=>'<div class="row"><span>'+(x.core?'FATHER CORE':'PROJECT')+'</span><b>'+x.name+'</b><span>'+folders.length+' standard folders · '+x.status+'</span></div>').join('');else if(bottom==='contracts')b.innerHTML=S.edges.map(e=>'<div class="row"><span>'+e.type+'</span><b>'+e.from+' → '+e.to+'</b><span>'+e.contract+'</span></div>').join('')||'<div class="row"><span>NONE</span><b>No edges</b><span>Соедини OUT → IN.</span></div>';else if(bottom==='events')b.innerHTML=S.events.slice(0,40).map(e=>'<div class="row"><span>'+e.t.slice(11,19)+'</span><b>'+e.k+'</b><span>'+e.m+'</span></div>').join('');else b.innerHTML='<div class="row"><span>CORE</span><b>Protected</b><span>FATHER core нельзя удалить/архивировать.</span></div><div class="row"><span>PROJECT</span><b>Mutable</b><span>Проектные агенты расширяемы и архивируемы.</span></div><div class="row"><span>ALINA</span><b>Black box</b><span>Внутри этого проекта моделируется только контракт.</span></div><div class="row"><span>SECRETS</span><b>External</b><span>Интеграционный registry не хранит credentials.</span></div>'}
function stats(){$('#count').textContent='CORE '+core.length+' · PROJECT '+([...projects,...S.custom].length)+' · INTEGRATIONS '+ints.length+' · CANVAS '+S.nodes.length}
$('#tabs').onclick=e=>{let b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;$$('#tabs button').forEach(x=>x.classList.toggle('active',x===b));renderCatalog()};$('#q').oninput=renderCatalog;$('#newAgent').onclick=()=>dlg.showModal();$('#create').onclick=()=>{let n=$('#an').value.trim();if(!n)return;S.custom.push({id:'USR-AGENT-'+Date.now(),name:n,icon:'USR',role:$('#ar').value||'Custom project agent',kind:'agent',core:false,status:'DESIGN'});save();dlg.close();tab='projects';renderCatalog();stats()};$('#reset').onclick=()=>{if(confirm('Reset local workspace state?')){S={custom:[],arch:[],nodes:[],edges:[],events:[]};save();renderCatalog();renderCanvas();renderBottom()}};$('#in').onclick=()=>addNode('io','INPUT',50,100);$('#out').onclick=()=>addNode('io','OUTPUT',1050,100);$('#fit').onclick=fit;$$('#btabs button').forEach(x=>x.onclick=()=>{bottom=x.dataset.b;renderBottom()});let v=$('#view');v.ondragover=e=>e.preventDefault();v.ondrop=e=>{e.preventDefault();let a=JSON.parse(e.dataTransfer.getData('father')||'null');if(!a)return;let r=v.getBoundingClientRect();addNode(a.kind,a.id,e.clientX-r.left-95,e.clientY-r.top-40)};window.onresize=draw;renderCatalog();renderCanvas();renderBottom();stats();
</script>
</body></html>
