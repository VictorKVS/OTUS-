<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="t d">
<title id="t">FATHER Factory Flow Map</title><desc id="d">Production flow from input docks through core agent stations to data, knowledge and output factories.</desc>
<defs><style>
.bg{fill:#071017}.box{fill:#0d1821;stroke:#274456;stroke-width:2}.core{stroke:#4ed9ff}.gate{stroke:#63e6a5}.side{stroke:#9b83ff}.out{stroke:#ffbd65}.tx{font-family:Segoe UI,Arial,sans-serif;fill:#edf7ff}.mu{font-family:Segoe UI,Arial,sans-serif;fill:#8ea6b6}.id{font-family:Consolas,monospace;fill:#4ed9ff}
</style></defs>
