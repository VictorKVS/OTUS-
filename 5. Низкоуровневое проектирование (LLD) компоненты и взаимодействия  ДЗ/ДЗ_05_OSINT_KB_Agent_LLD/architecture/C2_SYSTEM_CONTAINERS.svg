<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
<style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px}.box{fill:#f8fafc;stroke:#64748b;stroke-width:1.6;rx:12}.user{fill:#fff3d6}.ai{fill:#eaf2ff;stroke:#2f6fed;stroke-width:2}.db{fill:#ecfdf5;stroke:#059669;stroke-width:1.6}.ext{fill:#fef2f2;stroke:#b42318;stroke-width:1.4}.arrow{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#a)}</style>
