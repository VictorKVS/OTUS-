  name: "QA / Technical Verification Agent"
  status: scaffold
  maturity: M0
  stages: [V1]
  owner: FATHER Agent Zoo
role: "Проверяет build, unit/integration/contract/security/eval/load evidence и traceability implementation."
contracts:
  prompt: ./prompt.md
  rag: ./rag.yaml
  knowledge: ./knowledge.yaml
inputs:
  project_id: required
  stage_context: required
  artifact_refs: required
outputs:
