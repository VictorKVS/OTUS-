name: DZ07 Multi-Agent Demo Verification

on:
  pull_request:
    paths:
      - '7. Архитектурные паттерны AI-агенты и Multi-Agent Systems  ДЗ/ДЗ_07_Travel_MultiAgent_RAG/**'
      - '.github/workflows/dz7-multiagent-demo.yml'
  push:
    branches: [main]
    paths:
      - '7. Архитектурные паттерны AI-агенты и Multi-Agent Systems  ДЗ/ДЗ_07_Travel_MultiAgent_RAG/**'
      - '.github/workflows/dz7-multiagent-demo.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: '7. Архитектурные паттерны AI-агенты и Multi-Agent Systems  ДЗ/ДЗ_07_Travel_MultiAgent_RAG'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest openapi-spec-validator
      - name: Compile
        working-directory: '7. Архитектурные паттерны AI-агенты и Multi-Agent Systems  ДЗ/ДЗ_07_Travel_MultiAgent_RAG'
        run: python -m compileall -q src tests tools
      - name: Validate OpenAPI continuation from DZ05
        working-directory: '7. Архитектурные паттерны AI-агенты и Multi-Agent Systems  ДЗ/ДЗ_07_Travel_MultiAgent_RAG'
        run: openapi-spec-validator api/openapi-travel.yaml
      - name: Test typed messages, handoffs and RAG
        working-directory: '7. Архитектурные паттерны AI-агенты и Multi-Agent Systems  ДЗ/ДЗ_07_Travel_MultiAgent_RAG'
        run: python -m pytest -q
      - name: Retrieval quality report
        working-directory: '7. Архитектурные паттерны AI-агенты и Multi-Agent Systems  ДЗ/ДЗ_07_Travel_MultiAgent_RAG'
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'src')
          from travel_multiagent_demo import evaluate_retrieval
          metrics = evaluate_retrieval(top_k=2)
          print(metrics)
          assert metrics['hit_rate_at_k'] >= 0.80
          assert metrics['mrr_at_k'] >= 0.70
          PY
      - name: Run demo
        working-directory: '7. Архитектурные паттерны AI-агенты и Multi-Agent Systems  ДЗ/ДЗ_07_Travel_MultiAgent_RAG'
        run: python src/travel_multiagent_demo.py
      - name: Build architecture PDF
        working-directory: '7. Архитектурные паттерны AI-агенты и Multi-Agent Systems  ДЗ/ДЗ_07_Travel_MultiAgent_RAG'
        run: python tools/build_architecture_pdf.py
      - name: Verify architecture PDF
        working-directory: '7. Архитектурные паттерны AI-агенты и Multi-Agent Systems  ДЗ/ДЗ_07_Travel_MultiAgent_RAG'
        run: |
          PDF='architecture/DZ07_TRAVEL_MULTIAGENT_ARCHITECTURE.pdf'
          test -s "$PDF"
          head -c 5 "$PDF" | grep -q '%PDF-'
          test "$(stat -c%s "$PDF")" -gt 30000
          sha256sum "$PDF"
      - name: Commit generated PDF on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          PDF='7. Архитектурные паттерны AI-агенты и Multi-Agent Systems  ДЗ/ДЗ_07_Travel_MultiAgent_RAG/architecture/DZ07_TRAVEL_MULTIAGENT_ARCHITECTURE.pdf'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PDF"
          if git diff --cached --quiet; then
            echo 'Architecture PDF is already up to date'
            exit 0
          fi
          git commit -m 'docs(dz7): rebuild M1.1 architecture PDF [skip ci]'
          git push origin HEAD:main
