name: Telegram Voice Bridge

on:
  push:
    paths:
      - 'agents/runtime/telegram-voice-bridge/**'
      - 'agents/kits/kit-telegram-voice-bridge/**'
      - 'knowledge/specialists/communication-bridge/**'
      - 'tests/test_voice_bridge_trace.py'
      - '.github/workflows/telegram-voice-bridge.yml'
  pull_request:
    paths:
      - 'agents/runtime/telegram-voice-bridge/**'
      - 'agents/kits/kit-telegram-voice-bridge/**'
      - 'knowledge/specialists/communication-bridge/**'
      - 'tests/test_voice_bridge_trace.py'
  workflow_dispatch:

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile runtime Python
        run: python -m py_compile agents/runtime/telegram-voice-bridge/main.py agents/runtime/telegram-voice-bridge/providers.py agents/runtime/telegram-voice-bridge/tracing.py
      - name: Test privacy-safe tracing
        run: python -m unittest tests/test_voice_bridge_trace.py -v
      - name: Validate shared knowledge and Agent Kit
        run: |
          python tools/validate_knowledge_profiles.py
          python tools/validate_agent_kits.py