name: Build DZ05 submission PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dz5-build-submission-pdf.yml'
      - '5. Низкоуровневое проектирование (LLD) компоненты и взаимодействия  ДЗ/ДЗ_05_OSINT_KB_Agent_LLD/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation and PDF dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab svglib pillow pymupdf openapi-spec-validator

      - name: Validate OpenAPI 3.1
        run: |
          openapi-spec-validator "5. Низкоуровневое проектирование (LLD) компоненты и взаимодействия  ДЗ/ДЗ_05_OSINT_KB_Agent_LLD/api/openapi.yaml"

      - name: Build submission PDF
        run: |
          python "5. Низкоуровневое проектирование (LLD) компоненты и взаимодействия  ДЗ/ДЗ_05_OSINT_KB_Agent_LLD/tools/build_submission_pdf_v2.py"

      - name: Add contextual GitHub links and clean footer
        run: |
          python "5. Низкоуровневое проектирование (LLD) компоненты и взаимодействия  ДЗ/ДЗ_05_OSINT_KB_Agent_LLD/tools/postprocess_submission_pdf.py"

      - name: Refresh checksum after post-processing
        run: |
          PDF="5. Низкоуровневое проектирование (LLD) компоненты и взаимодействия  ДЗ/ДЗ_05_OSINT_KB_Agent_LLD/DZ05_LLD_OSINT_KB_AGENT_SUBMISSION.pdf"
          SHA="5. Низкоуровневое проектирование (LLD) компоненты и взаимодействия  ДЗ/ДЗ_05_OSINT_KB_Agent_LLD/SHA256SUMS.txt"
          cd "$(dirname "$PDF")"
          sha256sum "$(basename "$PDF")" > "$(basename "$SHA")"

      - name: Verify PDF
        run: |
          PDF="5. Низкоуровневое проектирование (LLD) компоненты и взаимодействия  ДЗ/ДЗ_05_OSINT_KB_Agent_LLD/DZ05_LLD_OSINT_KB_AGENT_SUBMISSION.pdf"
          test -s "$PDF"
          head -c 5 "$PDF" | grep -q '%PDF-'
          test "$(stat -c%s "$PDF")" -gt 50000
          sha256sum "$PDF"

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "5. Низкоуровневое проектирование (LLD) компоненты и взаимодействия  ДЗ/ДЗ_05_OSINT_KB_Agent_LLD/DZ05_LLD_OSINT_KB_AGENT_SUBMISSION.pdf"
          git add "5. Низкоуровневое проектирование (LLD) компоненты и взаимодействия  ДЗ/ДЗ_05_OSINT_KB_Agent_LLD/SHA256SUMS.txt"
          if git diff --cached --quiet; then
            echo "PDF is already up to date"
            exit 0
          fi
          git commit -m "docs(dz5): rebuild linked submission PDF [skip ci]"
          git push origin HEAD:main
