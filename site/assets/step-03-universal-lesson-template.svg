<text x="105" y="375" class="m" font-size="14">строгая нотация · связи · входы/выходы · решения</text>
<text x="105" y="406" class="m mono" font-size="13">BUS → REQ → ADR → CMP → TEST</text>

<rect x="840" y="300" width="690" height="150" rx="20" class="box vio"/>
<text x="875" y="342" class="t h" font-size="19">02 · VISUAL POSTER</text>
<text x="875" y="375" class="m" font-size="14">быстрое восприятие · одна модель со schema</text>
<text x="875" y="406" class="m mono" font-size="13">same IDs · same semantics · different presentation</text>

<rect x="70" y="495" width="430" height="150" rx="20" class="box cyan"/>
