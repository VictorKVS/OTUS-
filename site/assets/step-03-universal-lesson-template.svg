<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">Universal Lesson Template — FATHER Architect OS</title>
<desc id="desc">Visual-first template showing schema, visual, OTUS Curriculum, Architect Pro, FATHER Production, artifacts, evidence, traceability, maturity and sources.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071018"/><stop offset="1" stop-color="#17152d"/></linearGradient>
  <style>.t{font-family:Segoe UI,Arial,sans-serif;fill:#eef7ff}.m{fill:#91a9ba}.h{font-weight:700}.box{fill:#0e1b26;stroke:#29495d;stroke-width:2}.cyan{stroke:#4ed9ff}.vio{stroke:#9d84ff}.green{stroke:#63e6a5}.orange{stroke:#ffad57}.red{stroke:#ff7272}.mono{font-family:Consolas,monospace}</style>
</defs>
<rect width="1600" height="980" rx="28" fill="url(#bg)"/>
<text x="70" y="70" class="t h" font-size="34">STEP 03 · Universal Lesson Template</text>
<text x="70" y="108" class="m mono" font-size="15">SCHEMA → VISUAL → OTUS → ARCHITECT PRO → FATHER PRODUCTION → EVIDENCE → MATURITY</text>

