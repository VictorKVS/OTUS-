<text x="100" y="568" class="m" font-size="13">материалы · требования · ДЗ</text>
<text x="100" y="596" class="m" font-size="13">что дано курсом</text>

<rect x="585" y="495" width="430" height="150" rx="20" class="box vio"/>
<text x="615" y="537" class="t h" font-size="18">04 · ARCHITECT PRO</text>
<text x="615" y="568" class="m" font-size="13">standards · trade-offs · methods</text>
<text x="615" y="596" class="m" font-size="13">как делает профессионал</text>

