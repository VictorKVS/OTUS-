<rect x="70" y="690" width="340" height="120" rx="18" class="box green"/>
<text x="100" y="730" class="t h" font-size="17">ARTIFACTS</text><text x="100" y="762" class="m" font-size="13">docs · code · diagrams · configs</text>

<rect x="440" y="690" width="340" height="120" rx="18" class="box green"/>
<text x="470" y="730" class="t h" font-size="17">TESTS / EVIDENCE</text><text x="470" y="762" class="m" font-size="13">checks · metrics · review · CI</text>

<rect x="810" y="690" width="340" height="120" rx="18" class="box cyan"/>
<text x="840" y="730" class="t h" font-size="17">TRACEABILITY</text><text x="840" y="762" class="m" font-size="13">source → decision → component → proof</text>

